<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarsCrud | Home</title>
    <!--BOOOSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!--CSS-->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!--HEADER-->
    <header class="containe" id="header">
        <div class="row h-100 w-100">
            <div class="col-sm-6 d-flex align-items-center justify-content-center">
                <div class="">
                    <img src="./assets/CarsCrud-removebg 1.png" alt="">
                </div>
                <div class="BisnessName">
                    <img src="./assets/Logo.png" alt="">
                </div>

            </div>
            <div class="col-sm-6 d-flex justify-content-center align-items-center">
                <div class="">
                    <img src="./assets/Profil & Notification.png" alt="">
                </div>
            </div>
        </div>

    </header>

    <!--MAIN-->
    <main class="container mt-5">
        <!-- HERO -->
        <div class="row g-4">
            <div class="col-md-6">
                <div class="hero-card hero-left d-flex flex-column justify-content-between">
                    <div class="col-md-6">
                        <h2>The Best Platform for CarRental</h2>
                        <p class="fs-6 my-2">Ease of doing a car rental safely and reliably. Of course at a low price.
                        </p>
                        <button class="btn btn-lg" id="btn_left">Rental Car</button>
                    </div>
                    <div class="d-flex justify-content-center">
                        <div id="" class="mt-3 img-container">
                            <img src="./assets/white_car.png" class="car-img">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="hero-card hero-right d-flex flex-column justify-content-between">
                    <div class="col-md-6">
                        <h2>Easy way to rent a car at a low price</h2>
                        <p class="fs-6">Providing cheap car rental services and safe facilities.</p>
                        <button class="btn btn-lg" id="btn_right">Rental Car</button>
                    </div>
                    <div class="d-flex justify-content-center">
                        <div id="" class="mt-3 img-container">
                            <img src="./assets/gray_car.png" class="car-img">
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!--SEARCH-->
        <section class="w-100 rounded-3 mt-5 bg-white" id="search-section">
            <div class="container">
                <div class="row w-100 bg-light">
                    <div class="search-box position-relative">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" class="form-control search-input" placeholder="Buscar Vehículo">
                    </div>
                </div>
            </div>
        </section>

        <!--HIDE SECTION-->
        <section>
            <div id="hidden_section" class="container mt-5">

                <!-- PICK UP -->
                <div class="booking-card">
                    <div class="d-flex align-items-center mb-3">
                        <input type="radio" name="pick-up" id="pick-up" class="radio-dot">
                        <!-- <div class="radio-dot"></div> -->
                        <div class="section-title">Pick – Up</div>
                    </div>

                    <div class="row align-items-center text-center">
                        <div class="col">
                            <div class="label">Locations</div>
                            <select class="form-select text-center">
                                <option>Semarang</option>
                                <option>Jakarta</option>
                                <option>Bandung</option>
                            </select>
                        </div>

                        <div class="col-auto divider"></div>

                        <div class="col">
                            <div class="label">Date</div>
                            <input type="date" class="form-control text-center" value="2022-07-20">
                        </div>

                        <div class="col-auto divider"></div>

                        <div class="col">
                            <div class="label">Time</div>
                            <input type="time" class="form-control text-center" value="07:00">
                        </div>
                    </div>
                </div>

                <!-- DROP OFF -->
                <div class="booking-card">
                    <div class="d-flex align-items-center mb-3">
                        <!-- <div class="radio-dot" style="background:#93c5fd"></div> -->
                        <input type="radio" name="pick-up" id="pick-up" class="radio-dot">
                        <div class="section-title">Drop – Off</div>
                    </div>

                    <div class="row align-items-center text-center">
                        <div class="col">
                            <div class="label">Locations</div>
                            <select class="form-select text-center">
                                <option>Semarang</option>
                                <option>Jakarta</option>
                                <option>Bandung</option>
                            </select>
                        </div>

                        <div class="col-auto divider"></div>

                        <div class="col">
                            <div class="label">Date</div>
                            <input type="date" class="form-control text-center" value="2022-07-21">
                        </div>

                        <div class="col-auto divider"></div>

                        <div class="col">
                            <div class="label">Time</div>
                            <input type="time" class="form-control text-center" value="01:00">
                        </div>
                    </div>
                </div>

            </div>

        </section>



    </main>

    <!--FOOTER-->
    <footer>

    </footer>

    <script src="./JS/script.js"></script>

</body>

</html>
